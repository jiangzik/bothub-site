# Include inside the HTTPS server block for bothub.bookab.info.
# Nitro emits route.html plus route/_payload.json (autoSubfolderIndex: false).
# Canonical page URLs have no trailing slash; @nuxtjs/i18n owns /zh and /en.
location = / {
    return 301 /zh$is_args$args;
}

location ~ ^/(zh|en)(/.*)?/$ {
    return 301 /$1$2$is_args$args;
}

location / {
    # Only HTML pages and actual files are served. Never resolve directories:
    # payload directories must not create redirects or hide missing page HTML.
    try_files $uri.html $uri =404;
}
